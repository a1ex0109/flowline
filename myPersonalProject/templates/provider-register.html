<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anbieter Registrierung – Flowline</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body class="min-h-screen flex flex-col">

    <div class="flex-1 flex items-center justify-center">
        <div class="bg-white p-10 rounded-[14px] shadow-xl w-full max-w-[420px] max-h-[90vh] overflow-y-auto">
            <h1 class="text-center text-[28px] font-semibold mb-8 text-[#1a1a1a]">
                Anbieter Registrierung
            </h1>

            <form onsubmit="submitForm('/register/provider/submit'); return false;"
                  class="flex flex-col gap-5">

                <!-- alle deine Felder -->
                <div class="form-group">
                    <label for="owner_name">Dein Name</label>
                    <input type="text" id="owner_name" name="owner_name" placeholder="Max Mustermann" required>
                </div>

                <div class="form-group">
                    <label for="business_name">Salonname</label>
                    <input type="text" id="business_name" name="business_name" placeholder="Unternehmensname" required>
                </div>

                <div class="form-group">
                    <label for="category">Kategorie</label>
                    <select id="category" name="category" required
                            class="px-4 py-3 rounded-lg border border-[#d0d7e2] text-[16px] focus:border-[#4CAF50] focus:ring-[4px] focus:ring-[#4CAF50]/25 outline-none">
                        <option value="" disabled selected>Kategorie auswählen…</option>
                        <option value="Friseur / Barbershop">Friseur / Barbershop</option>
                        <option value="Nagelstudio">Nagelstudio</option>
                        <option value="Tattoostudio">Tattoostudio</option>
                        <option value="Sonstiges">Sonstiges</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">E-Mail Adresse</label>
                    <input type="email" id="email" name="email" placeholder="E-Mail Adresse" required>
                </div>

                <div class="form-group">
                    <label for="street">Straße + Hausnummer</label>
                    <input type="text" id="street" name="street" placeholder="Straße + Hausnummer" required>
                </div>

                <div class="form-group">
                    <label for="postal_code">Postleitzahl</label>
                    <input type="text" id="postal_code" name="postal_code" placeholder="PLZ" required>
                </div>

                <div class="form-group">
                    <label for="city">Ort</label>
                    <input type="text" id="city" name="city" placeholder="Ort" required>
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password" minlength="8" placeholder="Passwort" required>
                </div>

                <div class="form-group">
                    <label for="password_repeat">Passwort wiederholen</label>
                    <input type="password" id="password_repeat" name="password_repeat" minlength="8" placeholder="Passwort wiederholen" required>
                </div>

                <button type="submit" class="btn-primary">Registrieren</button>

                <p class="auth-link">
                    Schon ein Konto? <a href="/provider-login-page">Login</a>
                </p>
            </form>
        </div>
    </div>

    <div class="text-center text-xs text-gray-400 mt-auto mb-4">
        <div class="mb-1">
            <a href="#" class="underline text-gray-500">Nutzungsbedingungen</a>
            <span class="mx-2">|</span>
            <a href="#" class="underline text-gray-500">Datenschutz</a>
        </div>
        <div>© 2026 <a href="#" class="underline text-gray-500">Flowline</a>. Alle Rechte vorbehalten.</div>
    </div>

    <div id="error-popup" class="popup">
        <div id="error" class="error"></div>
    </div>
</body>
<script>
let popupTimeout = null;

var socket = io();

socket.on("connect", () => {
   socket.emit("join_room", { room: "{{ room_id }}" });
});

  socket.on("error", (data) => {
    document.getElementById("error").textContent = data.error;
    const popup = document.getElementById("error-popup");
    if (popup && popupTimeout == null) {
      popup.classList.add("show");
      popupTimeout = setTimeout(() => {
        popupTimeout = null;
        popup.classList.remove("show")
        }, 5000
      );
    }
  });

async function submitForm(actionUrl) {
  const owner_name = document.getElementById("owner_name");
  const business_name = document.getElementById("business_name");
  const category = document.getElementById("category");
  const email = document.getElementById("email");
  const street = document.getElementById("street");
  const postal_code = document.getElementById("postal_code");
  const city = document.getElementById("city");
  const password = document.getElementById("password");
  const password_repeat = document.getElementById("password_repeat");
  const formData = new FormData();

  formData.append("owner_name", owner_name.value)
  formData.append("business_name", business_name.value)
  formData.append("category", category.value)
  formData.append("email", email.value);
  formData.append("street", street.value);
  formData.append("postal_code", postal_code.value);
  formData.append("city", city.value);
  formData.append("password", password.value);
  formData.append("password_repeat", password_repeat.value);

  const res = await fetch(actionUrl, {
    method: "POST",
    body: formData
  })
  const data = await res.json();

  if (res.ok) {
      sessionStorage.setItem("reg_token", data.reg_token);
      const res1 = await fetch("/register/provider/code/send",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ reg_token: data.reg_token })
      })

      if (res1.ok) {
        window.location.href = `/register/provider/code?reg_token=${data.reg_token}`;
      } else {
        const data = await res1.json().catch(() => null);
        console.log(data?.error);
      }
  } else {
      const data = await res.json().catch(() => null);
      console.log(data?.error);
  }
}
</script>
</html>
