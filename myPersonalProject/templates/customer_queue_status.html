<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wartestatus – {{ provider.business_name }}</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #f0f2ee 0%, #e8ede8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: auto;
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: #2d6a4f;
            letter-spacing: -0.4px;
        }

        .provider-name {
            text-align: center;
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 0;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
            overflow: hidden;
        }

        /* ── Live badge header ── */
        .live-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            background: #f0fdf4;
            border-bottom: 1px solid #dcfce7;
        }
        .live-dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse-dot 1.6s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }
        .live-text {
            font-size: 12px;
            font-weight: 700;
            color: #15803d;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .card-body {
            padding: 36px 32px 32px;
            text-align: center;
        }

        /* ── Position hero number ── */
        .position-hero {
            margin-bottom: 4px;
        }
        .position-number {
            font-size: 72px;
            font-weight: 800;
            color: #111827;
            line-height: 1;
            letter-spacing: -2px;
        }
        .position-suffix {
            font-size: 17px;
            font-weight: 600;
            color: #6b7280;
            margin-top: 6px;
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: #f3f4f6;
            margin: 28px 0;
        }

        /* ── Info rows ── */
        .info-grid {
            display: flex;
            gap: 12px;
        }
        .info-box {
            flex: 1;
            background: #f9fafb;
            border-radius: 14px;
            padding: 16px 12px;
        }
        .info-label {
            font-size: 10px;
            font-weight: 700;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
        }
        .info-value {
            font-size: 20px;
            font-weight: 800;
            color: #111827;
        }
        .info-value.accent { color: #2d6a4f; }

        .customer-name {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 20px;
        }
        .customer-name strong { color: #4b5563; }

        /* ── Status states (done / no-show / error) ── */
        .state-icon {
            font-size: 52px;
            margin-bottom: 16px;
        }
        .state-title {
            font-size: 20px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 8px;
        }
        .state-text {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
        }

        .state-success .state-title { color: #15803d; }
        .state-error .state-title { color: #dc2626; }

        /* ── "You're up" pulsing ring ── */
        .active-ring {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: #dcfce7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
            position: relative;
        }
        .active-ring::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid #86efac;
            animation: ring-pulse 1.8s ease-out infinite;
        }
        @keyframes ring-pulse {
            0% { transform: scale(0.9); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .loading-text {
            font-size: 14px;
            color: #9ca3af;
            padding: 40px 0;
        }

        .footer-links {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 24px;
        }
        .footer-links a {
            color: #6b7280;
            text-decoration: underline;
        }
        .footer-links div:first-child { margin-bottom: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-row">
        <div class="logo">Flowline</div>
    </div>
    <div class="provider-name">{{ provider.business_name }}</div>

    <div class="card">
        <div class="live-header" id="live-header">
            <div class="live-dot"></div>
            <span class="live-text">Live-Status</span>
        </div>

        <div class="card-body" id="status-container">
            <div class="loading-text">Lädt...</div>
        </div>
    </div>
</div>
<div class="footer-links">
    <div>
        <a href="#">Nutzungsbedingungen</a>
        <span style="margin:0 6px;">|</span>
        <a href="#">Datenschutz</a>
    </div>
    <div>© 2026 <a href="#">Flowline</a>. Alle Rechte vorbehalten.</div>
</div>

<script>
    let pollInterval;

    function hideLiveHeader() {
        document.getElementById("live-header").style.display = "none";
    }

    async function updateStatus() {
        try {
            const res = await fetch("/queue/{{ token }}/status/{{ queue_id }}/data");

            if (!res.ok) {
                hideLiveHeader();
                document.getElementById("status-container").innerHTML = `
                    <div class="state-icon">⚠️</div>
                    <div class="state-title state-error-title" style="color:#dc2626;">Fehler beim Laden</div>
                    <div class="state-text">Bitte lade die Seite neu oder wende dich an das Personal.</div>
                `;
                clearInterval(pollInterval);
                return;
            }

            const data = await res.json();

            // Kunde ist dran
            if (data.status === "in_progress" || data.status === "Dran") {
                hideLiveHeader();
                document.getElementById("status-container").innerHTML = `
                    <div class="active-ring">✨</div>
                    <div class="state-title" style="color:#15803d;">Du bist dran!</div>
                    <div class="state-text">Bitte gehe jetzt zum Personal.</div>
                `;
                return;
            }

            // Nicht erschienen
            if (data.status === "no_show" || data.status === "Nicht erschienen") {
                hideLiveHeader();
                document.getElementById("status-container").innerHTML = `
                    <div class="state-icon">❌</div>
                    <div class="state-title" style="color:#dc2626;">Als nicht erschienen markiert</div>
                    <div class="state-text">Bitte wende dich an das Personal vor Ort.</div>
                `;
                clearInterval(pollInterval);
                return;
            }

            // Fertig / abgeschlossen
            if (data.status === "completed" || data.status === "Erledigt") {
                hideLiveHeader();
                document.getElementById("status-container").innerHTML = `
                    <div class="state-icon">✅</div>
                    <div class="state-title" style="color:#15803d;">Du wurdest bedient</div>
                    <div class="state-text">Bis zum nächsten Mal!</div>
                `;
                clearInterval(pollInterval);
                return;
            }

            // Normale Anzeige – wartend
            const waitDisplay = (data.estimated_wait_minutes !== null && data.estimated_wait_minutes !== undefined)
                ? `~${data.estimated_wait_minutes} Min`
                : "–";

            const positionLabel = data.position === 2 ? "Du bist als Nächstes dran" : "Personen vor dir";
            const positionNumber = data.position === 2 ? "" : data.position - 1;
            console.log(data.position, positionNumber);

            document.getElementById("status-container").innerHTML = `
                <div class="position-hero">
                    <div class="position-number">${positionNumber}</div>
                    <div class="position-suffix">${positionLabel}</div>
                </div>

                <div class="divider"></div>

                <div class="info-grid">
                    <div class="info-box">
                        <div class="info-label">Wartezeit</div>
                        <div class="info-value accent">${waitDisplay}</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">Status</div>
                        <div class="info-value" style="font-size:15px;">Wartend</div>
                    </div>
                </div>

                ${data.name ? `<div class="customer-name">Eingetragen als <strong>${data.name}</strong></div>` : ''}
            `;

        } catch (e) {
            hideLiveHeader();
            document.getElementById("status-container").innerHTML = `
                <div class="state-icon">📡</div>
                <div class="state-title" style="color:#dc2626;">Verbindungsfehler</div>
                <div class="state-text">Bitte überprüfe deine Internetverbindung.</div>
            `;
        }
    }

    updateStatus();
    pollInterval = setInterval(updateStatus, 5000);
</script>
</body>
</html>
