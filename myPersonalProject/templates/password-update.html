<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passwort ändern & bestätigen – Flowline</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="bg-white p-10 rounded-[14px] shadow-xl w-full max-w-[420px] m-auto">
        <h1 class="text-center text-[28px] font-semibold mb-8 text-[#1a1a1a]">Neues Passwort festlegen</h1>

        <form onsubmit="submitForm('/password-update/confirm'); return false;" class="flex flex-col gap-5">
            <div class="form-group">
                <label for="password">Passwort</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" minlength="8" placeholder="Passwort" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password_repeat">Passwort wiederholen</label>
                <div class="password-wrapper">
                    <input type="password" id="password_repeat" name="password_repeat" minlength="8" placeholder="Passwort wiederholen" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">Passwort aktualisieren</button>
        </form>
    </div>

    <div class="text-center text-xs text-gray-400 mt-auto mb-4">
        <div class="mb-1">
            <a href="#" class="underline text-gray-500">Nutzungsbedingungen</a>
            <span class="mx-2">|</span>
            <a href="#" class="underline text-gray-500">Datenschutz</a>
        </div>
        <div>© 2026 <a href="#" class="underline text-gray-500">Flowline</a>. Alle Rechte vorbehalten.</div>
    </div>

    <div id="message-popup" class="popup">
      <div id="message" class="message"></div>
    </div>
    <div id="error-popup" class="popup">
      <div id="error" class="error"></div>
    </div>
</body>
<script>
let popupTimeout = null;

var socket = io();

socket.on("connect", () => {
   socket.emit("join_room", { room: "{{ room_id }}" });
});

  socket.on("message", (data) => {
    document.getElementById("message").textContent = data.message;
    const popup = document.getElementById("message-popup");
    if (popup && popupTimeout == null) {
      popup.classList.add("show");
      popupTimeout = setTimeout(() => {
        popupTimeout = null;
        popup.classList.remove("show")
        }, 5000
      );
    }
  });

  socket.on("error", (data) => {
    document.getElementById("error").textContent = data.error;
    const popup = document.getElementById("error-popup");
    if (popup && popupTimeout == null) {
      popup.classList.add("show");
      popupTimeout = setTimeout(() => {
        popupTimeout = null;
        popup.classList.remove("show")
        }, 5000
      );
    }
  });

async function submitForm(actionUrl) {
  const password = document.getElementById("password");
  const password_repeat = document.getElementById("password_repeat");
  const formData = new FormData();

  formData.append("password", password.value);
  formData.append("password_repeat", password_repeat.value);
  formData.append("reset_token", sessionStorage.getItem("reset_token"));

  const res = await fetch(actionUrl, {
    method: "POST",
    body: formData
  })

  if (res.ok) {
    window.location.href = "/";
  } else {
    const data = await res.json().catch(() => null);
    console.log(data?.error);
  }
}
</script>
</html>
