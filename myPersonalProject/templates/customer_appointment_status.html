<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Wartestatus – {{ provider.business_name }}</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
    </style>
</head>
<body class="status-page-body">

<div class="status-page-wrapper">
    <div class="status-brand-row">
        <div class="brand-logo">Flowline</div>
    </div>
    <div class="provider-info-name">{{ appointment.provider.business_name }}</div>
    <div class="provider-info-address">{{ appointment.provider.street }}, {{ appointment.provider.postal_code }} {{ appointment.provider.city }}</div>

    <div class="status-card">
        <div class="live-header" id="live-header">
            <div class="live-dot"></div>
            <span class="live-text">Live-Status</span>
        </div>

        <div class="status-card-body" id="status-container">
            <div class="loading-text">Lädt...</div>
        </div>
    </div>
</div>
<div class="footer-links">
    <div>
        <a href="#">Nutzungsbedingungen</a>
        <span style="margin:0 6px;">|</span>
        <a href="#">Datenschutz</a>
        <span style="margin:0 6px;">|</span>
        <a href="/support">Hilfe & Support</a>
    </div>
    <div>© 2026 <a href="#">Flowline</a>. Alle Rechte vorbehalten.</div>
</div>

<script>
    let pollInterval;

    function hideLiveHeader() {
        document.getElementById("live-header").style.display = "none";
    }

    async function updateStatus() {
        try {
            const res = await fetch("/appointment/{{ token }}/status/data");

            if (!res.ok) {
                hideLiveHeader();

                // Unterscheidung: 404 (nicht gefunden/gelöscht) vs. andere Fehler
                const titleText = res.status === 404 ? "Termin nicht gefunden" : "Fehler beim Laden";
                const messageText = res.status === 404
                    ? "Dein Termin existiert nicht mehr oder wurde gelöscht. Bitte wende dich an das Personal."
                    : "Bitte lade die Seite neu oder wende dich an das Personal.";

                document.getElementById("status-container").innerHTML = `
                    <div class="state-icon">⚠️</div>
                    <div class="state-title" style="color:#dc2626;">${titleText}</div>
                    <div class="state-text">${messageText}</div>
                `;

                clearInterval(pollInterval);
                return;
            }

            const data = await res.json();

            // Kunde ist dran
            if (data.status === "in_progress" || data.status === "Dran") {
                hideLiveHeader();
                document.getElementById("status-container").innerHTML = `
                    <div class="active-ring">✨</div>
                    <div class="state-title" style="color:#15803d;">Du bist dran!</div>
                    <div class="state-text">Bitte gehe jetzt zum Personal.</div>
                `;
                return;
            }

            // Nicht erschienen
            if (data.status === "no_show" || data.status === "Nicht erschienen") {
                hideLiveHeader();
                document.getElementById("status-container").innerHTML = `
                    <div class="state-icon">❌</div>
                    <div class="state-title" style="color:#dc2626;">Als nicht erschienen markiert</div>
                    <div class="state-text">Bitte wende dich an das Personal vor Ort.</div>
                `;
                clearInterval(pollInterval);
                return;
            }

            if (data.status === "completed" || data.status === "Erledigt") {
                hideLiveHeader();
                document.getElementById("status-container").innerHTML = `
                    <div class="state-icon">✅</div>
                    <div class="state-title" style="color:#15803d;">Du wurdest bedient</div>
                    <div class="state-text">Bis zum nächsten Mal!</div>
                `;
                clearInterval(pollInterval);
                return;
            }

            // Normale Anzeige – wartend
            let waitDisplay = (data.estimated_wait_minutes !== null && data.estimated_wait_minutes !== undefined && !data.is_delayed)
                ? `~${data.estimated_wait_minutes} Min`
                : (data.current_overrun_minutes ?
                `Der aktuelle Termin dauert ca. ${data.current_overrun_minutes} Min. länger als geplant. Vielen Dank für Ihre Geduld!`
                : `Der aktuelle Termin dauert länger als geplant. Vielen Dank für Ihre Geduld!`);

            document.getElementById("status-container").innerHTML = `

                <div class="info-grid">
                    <div class="info-box">
                        <div class="info-label">Wartezeit</div>
                        <div class="info-value accent" style="${data.is_delayed ? 'font-size:18px;' : ''}">${waitDisplay}</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">Status</div>
                        <div class="info-value" style="font-size:15px;">Wartend</div>
                    </div>
                </div>

                ${data.name ? `<div class="customer-name">Eingetragen als <strong>${data.name}</strong></div>` : ''}
            `;

        } catch (e) {
            hideLiveHeader();
            document.getElementById("status-container").innerHTML = `
                <div class="state-icon">📡</div>
                <div class="state-title" style="color:#dc2626;">Verbindungsfehler</div>
                <div class="state-text">Bitte überprüfe deine Internetverbindung.</div>
            `;
        }
    }

    updateStatus();
    pollInterval = setInterval(updateStatus, 5000);
</script>
</body>
</html>
